name: Translations

on:
  push:
    branches: [main]
    paths:
      - "**/strings.json"
      - "**/translations/**"
      - "i18n/**"
      - "scripts/i18n.py"
  pull_request:
    paths:
      - "**/strings.json"
      - "**/translations/**"
      - "i18n/**"
      - "scripts/i18n.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build English copies
        run: python scripts/i18n.py build
      - name: Check key and placeholder parity
        run: python scripts/i18n.py check
      - name: Fail if generated files are stale
        run: git diff --exit-code -- '*/translations/en.json'
